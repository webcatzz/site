	<style>
body {
	display: flex;
	height: 100vh;
	margin: 0;
}

	padding-inline: 200px;
	overflow: hidden auto;
}
a {
	display: block;
	font: bold 4em sans-serif;
	text-align: center;
	text-decoration: none;
}
	</style>
</head>

	<a href="">chapter ten</a>
</nav>

<script>
const nav = document.querySelector("nav");
function updateScroll() {
	for (const link of nav.children) {
		let percent = (link.offsetTop - nav.offsetTop - nav.scrollTop) / link.offsetHeight;
		let sin = Math.sin(percent * 0.5);
		link.style.translate = sin * 200 + "px";
		link.style.scale = 1 - Math.abs(sin) * 0.25;
	}
}
nav.addEventListener("scroll", updateScroll);
updateScroll();
</script>

</body>
