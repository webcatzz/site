		<style>
			@font-face {font-family: homemade-apple; src: url(../assets/fonts/homemade-apple.ttf)}
			body {display: flex; flex-direction: column; color: white; height: 100vh; margin: 0; background: radial-gradient(at top, #03291abf, transparent 30%), linear-gradient(to bottom, black, transparent 30%), url(../assets/checkerboard-tilted.png) center / 240px #0d0b0e; overflow: hidden; image-rendering: auto}

			.card-wrapper {display: flex; justify-content: stretch; color: black; width: 200px; aspect-ratio: 2.75/4.75; transition: filter 0.15s, scale 0.2s ease-in; animation: 1s appear ease-out backwards; cursor: pointer}

			.card-wrapper:last-of-type {animation-delay: 1s}
			.untouchable {pointer-events: none}

			.back-face .card-front {display: none}
			.front-face .card-back {display: none}
			.card-back {width: 100%; height: 100%}
			.card-front {display: flex; flex-direction: column; width: 206px; padding: 9% 8%; border-radius: 3px; border-image: url(border.png) 64 48 169 48 / 6.5% 10% 17% 10% repeat; box-sizing: border-box; background-color: #bcb893; overflow: hidden}

			.card-name {display: flex; justify-content: center; align-items: center; color: black; text-transform: uppercase; line-height: 0.8; height: 12%; margin-top: auto}
			.card-name img {height: 10px; max-width: 100%}
			.card-name .text {margin-top: 0.1em}
			.space {display: inline-block; margin-right: 4px}

      .gray {color: #546d5b60; font-family: monospace; text-align: center}
