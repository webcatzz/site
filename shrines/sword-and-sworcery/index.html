<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superbrothers: Sword & Sworcery EP</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <style>
      body {
        height: 100vh; margin: 0;
        background:
        url("assets/believe.png") top repeat no-repeat,
        url("assets/believe.png") bottom repeat no-repeat,
        url(assets/concert.jpg) top / cover black;
      }
      .centerer {
        display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 32px;
        width: 100vw; height: 100vh;
        position: fixed; top: 0; left: 0;
      }
      
      @keyframes rotate {to {rotate: 360deg}}
      #disc {width: 50%; filter: drop-shadow(0 0 64px black) brightness(0.25); animation: 1s rotate linear infinite}
      #logo {width: 75%; filter: drop-shadow(0 0 32px white)}
      span {color: white; font-family: sans-serif; opacity: 0.5}
      
      #subtitle {
        display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 8px;
        color: lightgray; font-family: sans-serif; line-height: 1.25em;
        width: 800px; height: 132px; margin: 32px auto; padding: 32px; box-sizing: border-box;
        background: url(assets/quote.png) center / contain; position: relative;
      }
      #subtitle::before, #subtitle::after {font: bold 124px sans-serif; text-shadow: 0 8px var(--black); position: absolute; top: 0}
      #subtitle::before {content: "{"; right: calc(100% - 16px)}
      #subtitle::after {content: "}"; left: calc(100% - 16px)}
      p {margin: 0}
    </style>
  </head>
  <body>
    <div class="centerer">
      <img id="disc" src="assets/disc.png">
    </div>
    <div class="centerer">
      <img id="logo" src="assets/logo.png" alt="Superbrothers: Sword & Sworcery EP">
      <div id="subtitle">
        <p>so there's this huge conspiracy behind this game apparently.</p>
        <p>this'll be a page to document as much as i can find</p>
        <p>look forward to it</p>
      </div>
      <audio controls autoplay src="https://files.catbox.moe/hkl1p5.mp3"></audio>
    </div>
  </body>
</html>
