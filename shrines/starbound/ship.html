<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARBOUND</title>
    <link rel="icon" type="image/x-icon" href="assets/icon.png">
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
    <style>
      #teleporter {width: 62px; height: 80px; margin-left: 1px; background-image: url("assets/teleporter.png")}
      #radio {width: 18px; height: 17px; margin-left: 97px; margin-bottom: 48px; background-image: url("assets/radio-active.gif")}
      #locker {width: 32px; height: 24px; margin-left: 96px; margin-bottom: 8px; background-image: url("assets/locker.gif")}
      #sail {width: 24px; height: 24px; margin-left: 264px; margin-bottom: 8px; background-image: url("assets/sail.png")}
      #door {width: 14px; height: 40px; margin-left: 313px; background-image: url("assets/door.png")}
      #fuelhatch {width: 16px; height: 24px; margin-left: 336px; margin-bottom: 8px; background-image: url("assets/fuelhatch.gif")}
      #nav {width: 18px; height: 25px; margin-left: 367px; background-image: url("assets/nav.png")}
      #shadow {opacity: 0; position: absolute; animation: fadeIn 1s reverse; z-index: 1; pointer-events: none}

      #sail-info {display: none}
      #ui {display: none; width: 100%; height: 100%; border: none; position: fixed; top: 0; left: 0}
    </style>
  </head>
  <body>
    <div id="ship">
      <img id="shadow" src="assets/ship-shadow.png">
      <a id="teleporter" href="/index.html"></a>
      <a id="radio">
        <audio autoplay loop src="https://docs.google.com/uc?id=1SiWbPbNGdfHy4wkdz3wbcIAGmPhhJ287&export=download"></audio>
      </a>
      <a id="locker" target="ui"></a>
      <a id="sail" target="ui">
        <div id="sail-talk">Welcome, <span class="object">Protector</span>.</div>
        <div id="sail-info"></div>
      </a>
      <a id="door"></a>
      <a id="fuelhatch"></a>
      <a id="nav" target="ui"></a>
    </div>
    <iframe id="ui" name="ui"></iframe>
    <script>
      const sail = document.getElementById("sail");
      const sailTalk = document.getElementById("sail-talk");
      const sailInfo = document.getElementById("sail-info");
      const radio = document.getElementById("radio");
      const music = document.querySelector("audio");
      const ui = document.querySelector("iframe");
      var intro_progress = 0;

      /* INTRO */
      sail.onclick = function() {
        intro_progress += 1;
        switch (intro_progress) {
          case 1:
            sailTalk.innerHTML = "I am <span class='object'>S.A.I.L</span>, your Ship-Based Artificial Intelligence Lattice. <span class='action'>I manage the maintenance of your ship.</span>";
            break;
          case 2:
            sailTalk.innerHTML = "I am also programmed to offer you <span class='action'>useful information and advice</span>.";
            break;
          case 3:
            sailTalk.innerHTML = "<span class='object'>Earth</span> was <span class='action'>attacked by an unknown force</span>, and was subsequently <span class='action'>annihiliated</span>.";
            break;
          case 4:
            sailTalk.innerHTML = "The ship's <span class='object'>navigation systems</span> were <span class='action'>damaged</span> in our escape. Our location is <span class='action'>currently unknown</span>.";
            break;
          case 5:
            sailTalk.style.display = 'none';
            sailInform("sail");
            sail.href = 'sail.html';
            alert("hi! this shrine isn't done yet! i'm working on getting it up and running again, and content will come soon!");
            break;
        }
      }

      /* INFO */
      document.querySelectorAll("a").forEach(item => {
        console.log("logged: " + item.id);
        item.onmouseover = function() {sailInform(item.id)};
        item.onmouseout = function() {sailShut()};
      });

      function sailInform(hovered) {
        sailInfo.style.display = 'block';
        switch (hovered) {
          case "teleporter":
            sailInfo.innerHTML = "This <span class='object'>teleporter</span> will send you <span class='action'>back to this website's homepage</span>. Leaving so soon?";
            break;
          case "locker":
            sailInfo.innerHTML = "The ship's <span class='object'>locker</span>. It appears someone has <span class='action'>stuffed it full of digital photographs</span>. Take a look?";
            break;
          case "sail":
            if (intro_progress < 4) {sailInfo.style.display = 'none'};
            sailInfo.innerHTML = "Would you like me to <span class='action'>offer you</span> some more <span class='object'>information</span>?";
            break;
          case "nav":
            sailInfo.innerHTML = "The ship's <span class='object'>navigation systems</span>. <span class='greyed'>[WIP]</span>";
            break;
          default:
            sailShut();
            break;
        }
      }
      function sailShut() {sailInfo.style.display = 'none'}

      /* MUSIC */
      radio.onclick = function() {
        music.paused ? radio.style.backgroundImage = 'url("assets/radio-active.gif")' : radio.style.backgroundImage = 'url("assets/radio.png")';
        music.paused ? music.play() : music.pause();
      }
    </script>
  </body>
</html>
