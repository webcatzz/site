<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shrines</title>
    <link href="../style.css" rel="stylesheet" type="text/css" media="all">
    <style>
      body {flex-direction: row; background: linear-gradient(#000000e6, #000000e6), url(../assets/trip.gif) center}
      #container {display: flex; box-shadow: 0 0 1px white}
      a {flex: 1; display: flex; justify-content: center; align-items: center; color: var(--color); font: bold 1.5em sans-serif; text-align: center; aspect-ratio: 1; padding: 16px; background-color: black; transition: 0.1s}
      a:hover {color: lightgray; box-shadow: 0 8px 0 black; transform: translateY(-8px); background: var(--background) center / cover}
      a:hover span {mix-blend-mode: difference}
      a:active {color: black; background: var(--color)}
      a:hover span {mix-blend-mode: normal}
      #starbound {--color: slateblue; --background: url(starbound/assets/background.png)}
      #homestuck {--color: lime; --background: url(homestuck/assets/6.png)}
      #swordsworcery {--color: teal; --background: url(sword-and-sworcery/assets/bg_default.png)}
    </style>
  </head>
  <body class="center">
    <div id="container">
      <a id="starbound"><span>starbound</span></a>
      <a id="homestuck" href="homestuck/index.html"><span>homestuck</span></a>
      <a id="swordsworcery"><span>sword & sworcery</span></a>
    </div>
  </body>
</html>
