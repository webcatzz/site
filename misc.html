    <style>
      body {display: flex; gap: 32px; font: 0.8rem sans-serif; margin: 8px 32px; background: linear-gradient(91deg, transparent 50%, #0000001a 50%) center / 5% 100%, url(assets/wallpaper.png) repeat no-repeat bottom right / 20% auto, linear-gradient(to top, #241f1f 50%, #1f2423); overflow: hidden}

      #pinboard {flex: 1; height: calc(100vh - 16px); box-shadow: 0 2px 8px black, 0 2px 4px black inset; border: 8px outset #543619; box-sizing: border-box; background: url('assets/corkboard.jpg') top left; position: relative}

      .pin {
        color: black; text-shadow: none;
        width: min-content; height: min-content;
        position: absolute; filter: drop-shadow(0 2px 2px black);
        cursor: move;
      }

      .imglink img, .imglink a {display: block}
      .imglink a {box-shadow: none; position: absolute; opacity: 0.25; transition: 0.1s}
      .imglink a:hover {background-color: white}
      /*.imglink a {background-color: #ff0000bf}*/

      .framed {text-align: center; padding: 8px; box-shadow: 0 0 8px inset burlywood; background-color: white}
      .framed::after {
        content: ""; width: 150px; max-width: 75%; height: 30px;
        transform: translateX(-50%);
        background: url("assets/tape.png") no-repeat top center / 100%;
        position: absolute; top: -10px; left: 50%;
        opacity: 0.9; image-rendering: pixelated;
      }
      .framed:nth-of-type(even)::after {transform: translateX(-50%) scaleX(-1)}
      .text {width: max-content; padding: 24px}

      #sites {color: black; font-family: sans-serif; width: max-content; border-style: solid; border-width: 64px 111px 38px 197px; border-image: url(assets/text-file.png) 64 111 38 197; image-rendering: pixelated}
      #sites-container {display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 2px; width: max-content; height: 166px; padding: 4px; margin: -13px -84px -11px -188px; background-color: white; overflow: auto; cursor: default}
      #sites a, #sites img, .dud {display: block; width: 88px; height: 31px; margin: 0}
      #sites a img:hover {opacity: 0.5}
      @keyframes popup {from {scale: 0}}
      #sites a[data-notes]:hover::after {content: attr(data-notes); display: block; color: black; width: max-content; max-width: 200px; padding: 0.6em; padding-left: calc(0.6em + 3.5px); border: 0 solid; border-image: url("assets/imessage.png") 25 25 25 32 fill / 12.5px 12.5px 12.5px 16px stretch; transform-origin: bottom left; animation: 0.1s popup; position: absolute; left: 226px; top: 0}
      #sites .dud {display: inline-block; background-color: lightgray}
      #mine {grid-column: 1/5; display: flex; justify-content: center; align-items: center; gap: 4px; margin-bottom: 4px; background-color: lightgray}
      #utdr {grid-column: 1/5; width: 358px !important; height: auto}
      #utdr img {width: 100%; height: auto}
      #minimize, #maximize, #close {height: 19px; opacity: 0; position: absolute; top: -63px; cursor: pointer}
      #minimize:hover, #maximine:hover, #close:hover {opacity: 1}
      #minimize {width: 29px; background-color: #ffffff40; right: -30px}
      #maximize {width: 26px; background-color: #ffffff40; right: -56px; display: none}
      #close {width: 48px; background-color: #ff000040; right: -104px}

      #side {color: white; font-size: 1rem; min-width: 240px; position: relative}
      h1 {font-family: Magazine; text-shadow: 8px 4px black; background: linear-gradient(to right, #241f1f 50%, transparent 50%), linear-gradient(to bottom, transparent 49%, white, transparent 51%)}
      #transring {image-rendering: pixelated}
      .webring-prev, .webring-next {transition: 0.2s}
      .webring-prev:hover, .webring-next:hover {scale: 1.05; filter: brightness(1.1)}
      .webring-prev img, .webring-next img {transition: background-position-x 0.4s}
      .webring-prev:hover img, .webring-next:hover img {background-position-x: 0}
      .webring-prev:hover {transform: translateX(-2px)}
      .webring-prev img {background: linear-gradient(to left, #ffc5cb40, transparent) no-repeat; background-position-x: 31px}
      .webring-next:hover {transform: translateX(2px)}
      .webring-next img {background: linear-gradient(to right, #ffc5cb40, transparent) no-repeat; background-position-x: -31px}
      #return {display: flex; justify-content: center; align-items: center; height: 64px; color: #b3b9d1; font: bold 1.25em sans-serif; background-color: black; position: absolute; bottom: 0; left: 0; right: 0; transition: 0.1s}
      #return:hover {color: black; text-decoration: none; box-shadow: 4px 4px black; bottom: 4px; right: 4px; background-color: #b3b9d1}
      #return:active {color: white; background-color: white}
    </style>

        <script>
          var minimized = false
          document.getElementById("minimize").onclick = function() {

      <script>
        var zindex = 0
        $( ".pin" ).draggable();
        $( ".pin" ).on( "drag", function( event, ui ) {
          $( event.target ).css( "z-index", zindex );
          zindex += 1;
          if (event.target.id == "trans") {
            $( event.target ).css( "transition-property", "none" );
          };
        });
        
        $( "#trans" ).on( "dragstop", function (event, ui) {
          $( event.target ).css( "transition-property", "top" );
          $( event.target ).css( "top", "calc(100vh - 160px)" );
        });
