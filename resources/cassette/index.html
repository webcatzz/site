<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>stained glass</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Croissant+One&display=swap');
			body {color: #2e2e30; margin: 0; background-color: #1c1b1f}

			header, nav {display: flex}
			header {gap: 4em; background-color: #393846; border-bottom: 1px solid #47484f; box-shadow: 0 32px #32303c}
			h1 {color: transparent; font: 6em "Croissant One"; letter-spacing: -0.1em; background-image: linear-gradient(to right, #575a4a, #60626d); background-clip: text; -webkit-background-clip: text; height: 64px; padding-right: 0.1em; margin: 0; display: flex; align-items: center; overflow: hidden}
			nav a {color: #d28b57; font: bold 1em sans-serif; text-decoration: none; padding: 0 2em; margin: 0 0.5px; display: flex; justify-content: center; align-items: center}
			nav a:first-of-type {margin-left: 0}
			nav a:last-of-type {margin-right: 0}
			#link-red {color: #fffdf5; background-color: #d73f4f}
			#link-blu {color: #fffdf5; background-color: #63c3d7}
			#link-grn {color: #fffdf5; background-color: #79d05f}
		</style>
	</head>
	<body>
		<header>
			<h1>taped over</h1>
			<nav>
				<a id="link-red" href="">page 1</a>
				<a id="link-blu" href="">page 2</a>
				<a id="link-grn" href="">page 3</a>
			</nav>
		</header>
	</body>
</html>
