<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>subspace bubble</title>
		<style>
			body {display: flex; justify-content: center; margin: 64px 0; background-color: rgb(47, 43, 49)}
			#main, nav {box-sizing: border-box}
			#main {width: 600px; height: 200vh; padding: 32px; border: 4px solid #4000ff; background: hsla(0, 0%, 0%, 0.9); border-top-right-radius: 300px}
			h1 {color: white; mix-blend-mode: difference; font-size: 4em; letter-spacing: 4px; text-shadow: 0 2px black, 0 4px white; margin: 0}

			nav {width: 100px; height: max-content; padding: 64px 32px; padding-right: 0; margin-left: -50px; border-top-left-radius: 100px; background: #4000ff; position: sticky; top: 192px}
			nav a {display: block; color: white; padding-left: 8px}
			nav a:hover {background: lime}
		</style>
	</head>
	<body>
		<nav>
			<a href="">home</a>
			<a href="">about</a>
			<a href="">blog</a>
			<a href="">link</a>
		</nav>
		<div id="main">
			<h1>subspace bubble</h1>
		</div>
	</body>
</html>
