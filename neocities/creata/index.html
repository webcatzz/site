<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>webcatz //→ creata!</title>
		<link rel="icon" href="../assets/icon.svg">
		<link rel="stylesheet" href="../global.css">
		<style>
@font-face {font-family: ms-serif; src: url(../assets/fonts/ms-serif.ttf)}
body {color: var(--white); display: flex; min-height: 100vh; background-color: var(--black)}
#landing {flex: 9}
nav {flex: 10}

#landing {display: flex; flex-direction: column; align-items: center; background: linear-gradient(to bottom, var(--black) 30%, transparent), url(../assets/dots-black.png); padding-block: 1em 4em}
header {font: bold 6.5em sans-serif}
h1, .color-ladder {letter-spacing: 0.05em; text-align: center; margin-top: -0.8em}
h1 {color: var(--black); font-size: inherit; text-shadow: 0 -1.5px var(--white); margin-bottom: 0}
.color-ladder {user-select: none}
#r {color: #d62411; font-size: 95%; letter-spacing: 0.04em}
#o {color: #ff8426; font-size: 90%; letter-spacing: 0.03em}
#y {color: #ffd100; font-size: 85%; letter-spacing: 0.02em}
#g {color: #10d275; font-size: 80%; letter-spacing: 0.01em}
#b {color: #68aed4; font-size: 75%; letter-spacing: 0}
#p {color: #ff2674; font-size: 70%; letter-spacing: -0.01em; margin-top: 0}

p	{color: var(--gray); font-size: 0.875em; letter-spacing: 0.025em; line-height: 1.6; text-align: center; max-width: 400px}

#keyboard {display: flex; gap: 32px; width: max-content; padding-block: 2em; margin-top: auto}
.key {width: 8px; height: 8px; border-radius: 50%; transition: 0.1s; cursor: pointer; z-index: 1}
.key:hover {width: 16px; height: 16px; margin: -4px}
.key:active {border: 8px solid #ffffff80; box-sizing: border-box}
.key:first-of-type {background-color: #d62411}
.key:nth-of-type(2) {background-color: #ff8426}
.key:nth-of-type(3) {background-color: #ffd100}
.key:nth-of-type(4) {background-color: #10d275}
.key:nth-of-type(5) {background-color: #68aed4}
.key:last-of-type {background-color: #ff2674}

#back {color: var(--black); font-weight: bold; background-color: var(--white); padding: 0.5em}

nav {font-family: ms-serif; letter-spacing: 0.1em; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(225deg, #ffa430, transparent), linear-gradient(to bottom, #fa7a23 1px, transparent 1px) no-repeat repeat top / 100% 4px fixed #ff8426; padding-left: 8px; clip-path: polygon(16px 0, 100% 0, 100% 100%, 0 100%)}
nav a {color: inherit; display: block}

.big {display: flex; align-items: center; gap: 2em; width: 600px; padding-inline: 1em; position: relative}
.big:hover {background-color: #ffffff20; z-index: 10}
.big img {width: 224px; filter: drop-shadow(-32px 48px #00000020); margin-block: -1em; transition: filter 0.2s, margin-left 0.2s}
.big:hover img {margin-left: 16px; filter: drop-shadow(-40px 48px #00000020)}
.big:hover .label::after {content: " <"}
.big:first-of-type {margin-top: 0; z-index: 6}
.big:nth-of-type(2) {z-index: 5}
.big:nth-of-type(3) {z-index: 4}
.big:nth-of-type(4) {z-index: 3}
.big:nth-of-type(5) {z-index: 2}
.big:nth-of-type(6) {z-index: 1}

.line {display: flex; align-items: center; flex: 1}
.line::before {content: ""; width: 8px; height: 8px; border: 1px solid currentcolor; border-radius: 50%}
.line::after {content: ""; height: 1px; background-color: currentcolor; flex: 1}

#timeline {margin-top: 1em; transition: letter-spacing 0.2s}
#timeline:hover {letter-spacing: 0.25em; transition-duration: 0.5s}

@media (max-width: 800px) {
	body {display: block}
	nav {align-items: stretch; padding: 2em 1em; clip-path: polygon(0 8px, 100% 0, 100% 100%, 0 100%)}
	.big {gap: 0.5em; width: unset}
	.big img {width: 112px; filter: drop-shadow(-16px 24px #00000020); margin-block: -0.5em}
	.line::before {content: none}
}
		</style>
	</head>
	<body>
		<div id="landing">
			<header>
				<div id="p" class="color-ladder" aria-hidden="true">creata</div>
				<div id="b" class="color-ladder" aria-hidden="true">creata</div>
				<div id="g" class="color-ladder" aria-hidden="true">creata</div>
				<div id="y" class="color-ladder" aria-hidden="true">creata</div>
				<div id="o" class="color-ladder" aria-hidden="true">creata</div>
				<div id="r" class="color-ladder" aria-hidden="true">creata</div>
				<h1>creata</h1>
			</header>
			<p>welcome to my creata page! this is where i put some of the things i've worked on. check them out... hehheh...</p>
			<div id="keyboard" aria-hidden="true">
				<div class="key" data-note="https://files.catbox.moe/mvzhzv.mp3"></div>
				<div class="key" data-note="https://files.catbox.moe/u0o9ju.mp3"></div>
				<div class="key" data-note="https://files.catbox.moe/abv9al.mp3"></div>
				<div class="key" data-note="https://files.catbox.moe/6eq5se.mp3"></div>
				<div class="key" data-note="https://files.catbox.moe/pg3b68.mp3"></div>
				<div class="key" data-note="https://files.catbox.moe/jg18w3.mp3"></div>
			</div>
			<a id="back" href="../index.html">← back home...</a>
		</div>

		<nav>
			<a class="big" href="https://webcatz.itch.io">
				<img src="assets/jams.png">
				<div class="line" aria-hidden="true"></div>
				<div class="label">jam games</div>
			</a>
			<a class="big" href="../cat/index.html">
				<img src="assets/cat-comic.png">
				<div class="line" aria-hidden="true"></div>
				<div class="label">cat comic</div>
			</a>
			<a class="big" href="../lbau/index.html">
				<img src="assets/lbau.png">
				<div class="line" aria-hidden="true"></div>
				<div class="label">let's build a universe</div>
			</a>
			<a class="big" href="https://publictransit.neocities.org/wiki/">
				<img src="assets/transitpedia.png">
				<div class="line" aria-hidden="true"></div>
				<div class="label">transitpedia</div>
			</a>
			<a id="timeline" href="timeline.html">timeline</a>
		</nav>
		
		<script>
for (const key of document.getElementsByClassName("key")) key.onclick = play;
function play() {new Audio(this.dataset.note).play()}
onkeydown = e => {
	if (["1", "2", "3", "4", "5", "6"].includes(e.key)) document.getElementById("keyboard").children[Number(e.key) - 1].click();
}
		</script>
	</body>
</html>
