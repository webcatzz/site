  <script>
const ctx = document.getElementById("canvas").getContext("2d");
ctx.canvas.width = document.getElementById("main").offsetWidth;
ctx.canvas.height = document.getElementById("main").offsetHeight;
ctx.lineWidth = 16;

const colors = [
  getComputedStyle(canvas).getPropertyValue("--blue"),
  getComputedStyle(canvas).getPropertyValue("--red"),
  getComputedStyle(canvas).getPropertyValue("--yellow"),
];

let i = 0;
for (const link of document.querySelectorAll("#main > ul > li")) {
  ctx.strokeStyle = link.dataset.color ?? colors[++i % colors.length];
  ctx.beginPath();
  ctx.moveTo(-8, link.offsetTop - 48);
  ctx.lineTo(28, link.offsetTop + 10);
  for (const sublink of link.querySelectorAll("ul li")) {
    ctx.lineTo(sublink.offsetLeft + 28, sublink.offsetTop + 10);
  }
  ctx.stroke();
}
  </script>
