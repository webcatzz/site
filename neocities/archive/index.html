<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>webcatz //→ archive!</title>
  <link rel="icon" href="../_assets/icon.svg">
  <link rel="stylesheet" href="../global.css">
  <style>
@font-face {font-family: outlaw; src: url(_assets/outlaw.ttf)}
html {overscroll-behavior: none}
body {font: 14px/1 outlaw; background-color: #a0a3a1; min-height: 100vh; cursor: url(_assets/cursor.png), auto}
a, button {cursor: url(_assets/cursor-point.png) 12 0, pointer; &:active {cursor: url(_assets/cursor-click.png) 12 0, pointer}}

#view {width: 100%; min-height: 100vh; object-fit: contain; object-position: top}

#controls {
  display: flex; gap: 16px;
  background-color: #a0a3a1;
  padding: 4px; border-top: 2px solid #ebe4de;
  position: sticky; bottom: 0;
}
.inset {
  background-color: #b8b6b2;
  contain: size; padding: 2px;
  border: 2px solid;
  border-left-color: #5b5a65; border-top-color: #5b5a65;
  border-right-color: #ebe4de; border-bottom-color: #ebe4de;
  overflow-y: auto;
}
#captures {
  display: grid; grid-template-columns: repeat(5, 1fr);
  width: 120px; padding: 1px;
  & button, & a {padding: 1px}
  & img {width: 22px}
}
#note {width: 400px; white-space: pre-wrap}
hr {height: 0.125em; margin-block: 0 0.25em}
#pages {
  color: #ebe4de;
  display: flex; flex-direction: column;
  background: url(_assets/subpages.png) repeat-y right / 60px #312454; width: 120px;

  &::before {content: "Pages"}
  button {
    background-color: #5a5b64;
    padding: 2px;
    box-shadow: 2px 2px #222034;
    margin-right: 2px; margin-bottom: 2px;
  }
}
#since {margin-left: auto; align-self: end}
  </style>
</head>
<body>

  <img id="view" src="5.png">
  
  <div id="controls">
    <a href="../index.html"><img src="_assets/title.png"></a>

    <div id="captures" class="inset"></div>
    <div id="pages" class="inset"></div>
    <div id="note" class="inset">Hover over an archived page for details</div>

    <div id="since">since june 17, '22</div>

  </div>

  <script>
const captures = {
	fivepointfive: {
    version: 5.5,
    date: "-",
    note: "current version!",
    pages: [
			"about (11.5.24)",
    ]
	},
  five: {
    version: 5,
    date: "january 1st '24",
    note: "this design lasted exactly 4 months (1.8.23-1.1.24).",
    pages: [
			"index",
      "blog"
    ]
  },
  stars: {
    version: 4,
    date: "may 31st '23",
    pages: [
			"index",
      "about",
      "blog",
      "screenshots"
    ]
  },
  rouxls: {
    date: "january 3rd '23",
    type: "partial",
		pages: ["index"],
  },
  difference: {
    date: "december 17th '22",
    note: "i was really obsessed with mix-blend-mode: difference at this point in time",
    type: "partial",
		pages: ["index"],
  },
  tv: {
    date: "november 11th '22",
    pages: [
			"index",
      "index (xmas)",
      "purecontent",
      "blog"
    ]
  },
  corkboard: {
    version: 3,
    date: "october 7th '22",
    pages: [
			"index",
      "blog"
    ]
  },
  oneshot: {
    version: 2,
    date: "august 7th '22",
    note: "this design is lost to time, unfortunately. this broken about page is all that's left! inspired by oneshot--the buttons lit up in the computer colors and the textbox used alula dialogue sprites.",
		name: "tealcrows",
		type: "none",
    pages: [
			"about",
		]
  },
  tealcrows: {
    version: 1,
    date: "july 21st '22",
    note: "the very first version of the site... i made this in a hotel room, under the name \"tealcrows\". that textbox had the most horrible code you could dream of",
    pages: [
			"index",
      "about",
      "gallery",
      "blog"
    ]
  }
}


viewCapture(Object.keys(captures)[0]);
updateComment(current);


for (const key in captures) {
  let button = document.createElement("button");
  button.dataset.key = key;
  button.onclick = () => viewCapture(key);
  button.onmouseover = () => updateComment(key);
  button.onmouseout = resetComment;

  let img = button.appendChild(document.createElement("img"));
  img.src = "_assets/capture" + (captures[key].type ? "-" + captures[key].type : "") + ".png";

  document.getElementById("captures").appendChild(button);
}


var current;
function updateComment(key) {
  let info = captures[key];
  document.getElementById("note").innerHTML = `version: ${info.version ?? "-"}\nlast edit before capture: ${info.date ?? "-"}<hr>${info.note ?? ""}`;
}
function resetComment() {updateComment(current)}


function viewCapture(key) {
  current = key;
  view(current, captures[key].pages[0]);

  document.getElementById("pages").textContent = "";
  if (captures[current].pages) for (const page of captures[current].pages) {
    let button = document.createElement("button");
    button.textContent = page;
    button.onclick = () => view(current, page);
    document.getElementById("pages").appendChild(button);
  }
}
function view(capture, page) {
  document.getElementById("view").src = "";
  document.getElementById("view").src = `captures/${capture}/${page}` + (capture === "stars" && page === "screenshots" ? ".jpg" : ".png");
}
  </script>
</body>
</html>
