<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>​</title>
  <style>
body {
  display: flex; flex-direction: column;
  height: 50000vh; margin: 0;
  background: linear-gradient(to bottom, transparent 2300vh, #181425, #3f2832, #68386c, blue, #1c9ab8, #2cf5ce, #2ce8f5), url(assets/stars.png) black; image-rendering: pixelated;
}
#heavens {position: absolute; top: 32px; left: 42%; & a {width: 47.5%; aspect-ratio: 1; border-radius: 50%; display: block; position: absolute; top: 15%; right: 15%; &:hover {background-color: #ffffff40; transition: background-color 5s}}}
#cord {flex: 1; margin-bottom: calc(-50vh + 205px); background: url(assets/angel_tether.png) repeat-y bottom; z-index: 1; pointer-events: none}
#bottom {display: flex; justify-content: center; align-items: center; height: 100vh; & img {margin-top: -120px}}
  </style>
</head>
<body>
  <div id="heavens"><img src="assets/moon.png"><a href="moon-surface.html"></a></div>
  <div id="cord"></div>
  <div id="bottom"><img src="assets/angel.png"></div>
  <audio autoplay loop src="https://files.catbox.moe/m0b82o.mp3"></audio>
  <script>
scrollTo(0, document.body.clientHeight);

const audio = document.querySelector("audio");
var loop;
audio.playbackRate = 0.875;

onscroll = () => {
  if (scrollY > 200) {
    let percent = scrollY / document.body.clientHeight;
    audio.playbackRate = percent * 0.675 + 0.2, audio.volume = 1 - 0.75 * percent;
  } else audio.volume = 0;
}
onscrollend = () => {
  if (scrollY < 200 && !loop) {
    loop = setInterval(transmission, 10);
    addEventListener("scroll", endTransmission, {once: true});
  }
}

const title = "ebeffzbxrnaqzve";
var i = 0;
function transmission() {
  document.title = title.substring(i) + title.substring(0, i);
  if (++i == title.length) i = 0;
}
function endTransmission() {
  clearInterval(loop);
  loop = null, document.title="​";
}
  </script>
</body>
</html>
