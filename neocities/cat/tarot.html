<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>☾⋆⁺₊ cat comic...ᐟ</title>
	<link rel="icon" href="assets/icon.png">
	<link rel="stylesheet" href="../global.css">
	<link rel="stylesheet" href="cat.css">
	<style>
#table {
	display: flex; gap: 2em;
	padding: 1em 2em;
	background-image: url(assets/dither.png);
	margin-block: 1em;
}
.card {
	display: flex;
	justify-content: center;
	align-items: center;
	aspect-ratio: 2/3;
	background-color: white;
	flex: 1;
}
.flipped {cursor: pointer}
.flipped > * {display: none !important}
	</style>
</head>
<body>

<a class="pxl button back" href="javascript:history.back()">go back</a>

<div id="table">

	<div class="card flipped">
		<img src="assets/icons/moon.png">
	</div>
	
	<div class="card flipped">
		<img src="assets/icons/lighthouse.png">
	</div>

	<div class="card flipped">
		<img src="assets/icons/star.png">
	</div>

</div>

<script src="../lib/audio-player.js"></script>
<script src="format.js"></script>
<script>
for (const card of document.getElementsByClassName("card")) {
	card.addEventListener("click", () => {
		card.animate({transform: ["scaleX(1)", "scaleX(0)"]}, {duration: 750, easing: "ease-in"}).finished.then(() => {
			card.classList.remove("flipped");
			card.animate({transform: ["scaleX(0)", "scaleX(1)"]}, {duration: 750, easing: "ease-out"})
		})
	}, {once: true})
}
</script>
	
</body>
</html>
