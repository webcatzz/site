<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">

	<link rel="stylesheet" href="../global.css">
	<style>
@font-face {font-family: ms-serif;  src:  url(../assets/fonts/ms-serif.ttf)}
body {display: flex; justify-content: center; align-items: center; min-height: 100vh}
#text {max-width: 340px}

#jay {width: 86px; margin: 3em}

h1 {
	font-size: 2em;
	text-shadow:
		-0.1em -0.1em white, 0 -0.1em white, 0.1em -0.1em white, 0.1em 0 white,
		-0.1em 0.1em white, 0 0.1em white, 0.1em 0.1em white, -0.1em 0 white;
	background: url(title.png) 0 12.5% / 100%;
	padding: 0.5em; margin-top: 0;
}
.act {
	font: 0.875em ms-serif; letter-spacing: 0.5px;
	& a {color: gray; text-decoration: underline}
}

#audio {
	color: gray;
	font: 0.75em ms-serif; letter-spacing: 0.5px;
	padding: 0.5em; border: 1px solid;
	position: fixed; top: 1em; right: 1em;

	& button {display: flex; justify-content: center; align-items: center; width: 1.5em; height: 1.5em}
}

@media (max-width: 500px) {
	body {flex-direction: column; padding-inline: 1em}
}
	</style>
</head>
<body>
