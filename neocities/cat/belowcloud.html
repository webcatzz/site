<style>
:root {overscroll-behavior-y: none}
body::after {content: none}

#sun {
	height: 250px;
	background: radial-gradient(circle at bottom, transparent 100px, black 101px, transparent 102px);
}

#waters {
	font-size: 1.5em;
	height: 1600px;
	background: url(_assets/belowcloud-water.png) repeat-x, url(_assets/belowcloud-buildings.png) repeat-x bottom / 50%;
	border-bottom: 32px solid black;
	transform-origin: top;
}

@keyframes wave {
	25% {transform: translateY(4px)}
	50% {transform: translateY(0)}
	75% {transform: translateY(-4px)}
}
.wave-part {
	display: inline-block;
	animation: 2s wave steps(1) infinite;

	&:nth-of-type(4n - 3) {animation-delay: -0.25s}
	&:nth-of-type(4n - 2) {animation-delay: -0.5s}
	&:nth-of-type(4n - 1) {animation-delay: -0.75s}
}

.light {text-align: center}
</style>

<a class="pxl button back" href="#world">back to world</a>

<div id="sun"></div>

<div id="waters" class="pxl">

	<marquee behavior="alternate" scrollamount="1">
		<span class="wave-part">--</span>
		<span class="wave-part">≈≈≈≈</span>
		<span class="wave-part">~~~~</span>
		<span class="wave-part">≈≈≈≈</span>
		<span class="wave-part">----</span>
		<span class="wave-part">≈≈≈≈</span>
		<span class="wave-part">~~~~</span>
		<span class="wave-part">≈≈≈≈</span>
		<span class="wave-part">----</span>
		<span class="wave-part">≈≈≈≈</span>
		<span class="wave-part">~~~~</span>
		<span class="wave-part">≈≈≈≈</span>
		<span class="wave-part">--</span>
	</marquee>

	<div class="light">- ----==-====-==---- -</div>
	<div class="light">-- -==-=-==- --</div>
	<div class="light">- == -</div>
	<div class="light">-</div>

	<marquee scrollamount="1" scrolldelay="60" style="margin-top: 200px">&lt;=>&lt;</marquee>
	<marquee scrollamount="1" class="wave-part">&lt;=>&lt;</marquee>
	<marquee scrollamount="1" scrolldelay="70">
		<span class="wave-part">&lt;=</span>
		<span class="wave-part">>&lt;</span>
	</marquee>
	<marquee direction="right" scrollamount="1" scrolldelay="70">>&lt;=></marquee>

	<marquee direction="right" scrollamount="1" scrolldelay="60" style="margin-top: 650px">>&lt;=></marquee>
	<marquee direction="right" scrollamount="1" class="wave-part">
		<span class="wave-part">>&lt;</span>
		<span class="wave-part">=></span>
	</marquee>

</div>

<script>
addEventListener("scroll", e => {
	document.getElementById("waters").style.transform = "scaleY(" + (1 + Math.pow(scrollY/2500, 2)) + ")";
});
queueRefresh();
</script>
