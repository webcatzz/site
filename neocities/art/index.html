	<style>
@keyframes flow {to {background-position-x: 0, 320px, 128px}}
body {font-family: sans-serif; margin: 0; background: linear-gradient(to top, white, transparent), url(../_assets/checkerboard-tilted-white.png) 0 / 320px, url(bg.png) white; animation: 15s flow linear infinite; user-select: none}
#main {max-width: 600px; min-height: calc(100vh - 32px); padding: 16px 32px; background-color: white; position: relative}
h1, h2 {text-shadow: 0.1em 0.1em pink, 0.2em 0.2em pink; transform: skewX(-30deg)}
h2 {font-size: 1.25em; margin-top: -19.2px; margin-left: 12px; margin-bottom: 2rem}
#back {color: white; font-weight: bold; padding: 8px 12px; background-color: pink; position: absolute; top: 48px; right: 48px}
#back svg {vertical-align: -0.125em; height: 1em}

#grid {display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; image-rendering: auto}
figure {margin: 0; position: relative}
figcaption {text-align: right; font-size: 0.875em; line-height: 1.25; padding: 4px 8px 0; background-color: #ffc0cbbf; display: none; position: absolute; bottom: 0; left: 0; right: 0; pointer-events: none}
figure:hover {outline: 4px solid #ffc0cbbf; z-index: 1}
figure:hover figcaption {display: block}
.date {color: white; font-size: 0.875em; margin-left: 0.75em}
#grid img {width: 100%; height: 100%; aspect-ratio: 1; object-fit: cover}
#grid > *:first-child {grid-column: span 2; grid-row: span 2}
#grid > *:nth-child(2) {grid-column: span 2; aspect-ratio: 2}

#mspaint {color: #ffc0cbbf; position: fixed; bottom: 1em; right: 1em}

@media (max-width: 664px) {
	#back {position: fixed; top: unset; bottom: 16px; right: 16px}
}
	</style>
