<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>webcatz → art!</title>
		<link rel="icon" type="image/png" href="../assets/icon.png">
		<script defer src="https://kit.fontawesome.com/c558359c24.js" crossorigin="anonymous"></script>
		<link href="../global.css" rel="stylesheet" type="text/css" media="all">
		<link href="../lib/modal.css" rel="stylesheet" type="text/css" media="all">
		<style>
@keyframes flow {to {background-position-x: 0, 320px, 128px}}
body {font-family: sans-serif; margin: 0; background: linear-gradient(to top, white, transparent), url(../assets/checkerboard-tilted-white.png) 0 / 320px, url(bg.png) white; animation: 15s flow linear infinite}
#main {max-width: 600px; min-height: calc(100vh - 32px); padding: 16px 32px; background-color: white; position: relative}
h1, h2 {text-shadow: 0.1em 0.1em pink, 0.2em 0.2em pink; transform: skewX(-30deg)}
h2 {font-size: 1.25em; margin-top: -19.2px; margin-left: 12px; margin-bottom: 2rem}
#back {color: white; font-weight: bold; padding: 8px 12px; background-color: pink; position: absolute; top: 48px; right: 48px}

#grid {display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; image-rendering: auto}
#grid img {width: 100%; aspect-ratio: 1; object-fit: contain; cursor: pointer}
#grid img:first-of-type {grid-column: span 2; grid-row: span 2}
#grid img:nth-of-type(2) {grid-column: span 2; aspect-ratio: 2; object-fit: cover}
#grid img:hover {box-shadow: 0 0.5px 2px pink; z-index: 1}

@media (max-width: 664px) {#back {position: fixed; top: unset; bottom: 16px; right: 16px}}
		</style>
	</head>
	<body>
		<div id="main">
			<h1>june wants to draw...</h1>
			<h2>my art gallery; or, oops, all doodles!</h2>
			<a id="back" href="../index.html"><i class="fa-solid fa-arrow-left"></i> back home...</a>
			<div id="grid">
				<img src="nov 11, 2023.png" title="nov 11, 2023">
				<img src="nov 6, 2023.png" title="nov 6, 2023">
				<img src="oct 17, 2023.png" title="oct 17, 2023">
			</div>
		</div>
		<script src="../lib/modal.js"></script>
		<script>createModal(document.getElementById("grid").children, "#ffc0cb", "#ffffff");</script>
	</body>
</html>
