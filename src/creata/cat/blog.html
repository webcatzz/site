<style>
.grid {
	grid-template-columns: repeat(2, 220px);
	grid-template-rows: 1fr max-content;
	column-gap: 4px;
}
#tape-player {grid-row: 2; justify-self: start; z-index: 1}
#old {grid-column: 2; grid-row: span 2}

ul {
	list-style: none;
	display: flex;
	flex-direction: column;
	justify-content: end;
	align-items: center;
}
ul, li {padding-left: 0; margin-block: 0}
li a {
	color: inherit;
	text-decoration: none;
	display: flex;
	align-items: center;
	background-color: black;
	width: 130px;
	height: 20px;
	padding-inline: 1em;
	border-style: solid;
	border-width: 3px 33px;
	border-image: url(_assets/tape.png) 3 33 fill / 3px 33px;
	border-image-repeat: repeat;

	i {margin-right: 0.5em}
}

.rotated {
	--scale: 0.75;
	--side-length: calc(150px * (1 - var(--scale)));
	width: calc(220px * var(--scale));
	a {
		transform: scaleX(var(--scale));
		transform-origin: left;
	}
}
.slightly {--scale: 0.875}
.alot {--scale: 0.5}
.left {border-right: var(--side-length) solid black}
.right {border-left: var(--side-length) solid black}

.gray {
	position: relative;
	&::after {
		content: "";
		background-image: url(_assets/dither-mask.png);
		position: absolute;
		inset: 0;
		pointer-events: none;
	}
	&.left::after {right: calc(var(--side-length) * -1)}
	&.right::after {left: calc(var(--side-length) * -1)}
}
</style>

<h2>the first official real cat comic blog</h2>

<div class="grid">
	<ul>
		<li class="pxl"><a href="#blog-2"><i>#2 -</i>happy birthday</a></li>
		<li class="pxl"><a href="#blog-1"><i>#1 -</i>on aerie</a></li>
		<li class="pxl gray"><a></a></li>
	</ul>
	<img id="tape-player" src="_assets/tape-player.png" aria-hidden="true">
	<!-- <ul id="old">
		
	</ul> -->
</div>

<script>
let tapes = document.querySelectorAll(".grid li");
for (let i = 1; i < tapes.length; i++) if (Math.random() > 0.333) {
	tapes[i].classList.add("rotated", Math.random() > 0.5 ? "left" : "right");
	let rand = Math.random();
	if (rand < 0.333) tapes[i].classList.add("slightly");
	else if (rand > 0.667) tapes[i].classList.add("alot");
}
</script>
