<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>something here...?</title>
	<link rel="stylesheet" href="/blanket.css">
	<style>
@keyframes ripple {
	from {outline-offset: -1px; outline: 1px solid currentcolor}
	to {outline-offset: 16px; outline: 2px solid rgb(from currentcolor r g b / 0)}
}

@keyframes lap {
	from {margin: 0; padding: 1em}
	50% {margin: -0.25em; padding: 1.25em}
	to {margin: 0; padding: 1em}
}

body {
	display: flex;
	justify-content: center;
	align-items: center;
	color: #82b4e6;
	font-family: mspgothic;
	background-color: #5b4ecc;
	min-height: 100vh;
	box-sizing: border-box;
	padding: 64px;
	image-rendering: pixelated;
}

#wrapper {
	box-sizing: border-box;
	padding: 1em;
	border: 1px solid;
	border-radius: 1em;
	animation:
		ripple 2.5s linear infinite,
		lap 8s infinite;
}

#audio {
	display: block;
	background-color: currentcolor;
	width: 100%;
	border-radius: 0.5em;
}

#items {
	display: flex;
	gap: 0.5em;
}

.item {
	display: flex;
	justify-content: center;
	align-items: center;
	user-select: unset;
	height: 1em;
	border: 1px solid #82b4e6;
	border-radius: 0.5rem;
	margin-top: 0.5em;
	flex: 1;
	
	&:hover {
		background-color: #82b4e6;
	}

	&:active {
		border-color: #5b4ecc;
	}
}
	</style>
</head>
<body>

<div id="wrapper">
	<audio id="audio" controls src="https://file.garden/ZdmFgugxzVCR-8Bl/seashell/feet%20in%20the%20sand.mp3"></audio>
</div>

</body>
</html>
