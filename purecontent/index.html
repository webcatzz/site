<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>purecontent.</title>
    <link rel="icon" type="image/png" href="../assets/purecontent.png">
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
    <style>
      @keyframes move {to {background-position: -64px -64px, 64px 64px}}
      body {
        display: flex; flex-direction: column;
        max-width: 1024px; height: calc(100vh - 24px);
        padding: 0 16px; margin: auto;
        border: none;
        background: url("/assets/bg-1.png"), url("/assets/bg-2.png") black;
        animation: move 8s linear infinite;
      }
      #container {display: flex; flex: 1}

      h1 {text-align: center; margin: 24px auto; text-decoration: underline; text-decoration-style: dashed; text-decoration-color: #ffffff80}

      nav {width: max-content; padding: 16px; padding-left: 0; text-align: right}
      nav a {background-color: #00000080}
      nav a[target="_blank"]::after {content: "⤴"; line-height: 0; filter: brightness(0.5)}
      nav ul {list-style-type: none; padding: 0; margin: 0}
      nav details ul {padding-right: 8px; border-right: 1px dashed #fff1e880}
      #home {--accent: #7ed14a; --accent-trans: #7ed14a80}
      #about {--accent: #f86c8c; --accent-trans: #f86c8c80}
      #tad {--accent: #c74b35; --accent-trans: #c74b3580}
      #eyrie {--accent: #c7bba9; --accent-trans: #c7bba980}
      #outward {--accent: #ff1b00; --accent-trans: #ff1b0080}
      #music {--accent: #47ca98; --accent-trans: #47ca9880}
      #homestuck {--accent: #20e629; --accent-trans: #20e62980}
      #starbound {--accent: #9cabe9; --accent-trans: #9cabe980}
      #screenshots {--accent: #a28e8e; --accent-trans: #a28e8e80}
      #osts {--accent: #b86cba; --accent-trans: #b86cba80}

      iframe {width: 100%; height: 100%; border-radius: 2px}

      @media (orientation: portrait) {
        #container {flex-direction: column}
        nav * {display: inline}
        nav {text-align: left; width: calc(100vw - 46px); white-space: nowrap; overflow-x: scroll; overflow-y: hidden}
        nav details ul {padding: 0; border-right: none}
      }
    </style>
  </head>
  <body>
    <h1>purecontent.</h1>
    <div id="container">
      <nav>
        <h2>index</h2>
        <ul>
          <li><a id="home" target="main" href="splash.html">home.</a></li>
          <li><a id="about" target="main" href="about.html">about me.</a></li>
          <li><a target="_blank" href="../blog">my blog.</a></li>
          <li>
            <details open>
              <summary>creations/</summary>
              <ul>
                <li><a id="tad" target="_blank" href="../creata/tad">tad.</a></li>
                <li><a id="eyrie" target="_blank" href="../creata/eyrie">eyrie.</a></li>
                <li><a id="outward" target="_blank" href="../creata/outward">outward.</a></li>
                <li><a id="music" target="main" href="music.html">music.</a></li>
              </ul>
            </details>
          </li>
          <li>
            <details open>
              <summary>shrines/</summary>
              <ul>
                <li><a id="homestuck" target="_blank" href="../shrines/homestuck">homestuck.</a></li>
                <li><a id="starbound" target="_blank" href="../shrines/starbound">starbound.</a></li>
              </ul>
            </details>
          </li>
          <li><a id="screenshots" target="_blank" href="/screenshots">screenshots.</a></li>
          <li><a id="osts" target="main" href="osts.html">osts.</a></li>
          <!--li><a target="main" href="NAME.html">NAME</a></li-->
        </ul>
      </nav>
      <iframe name="main" src="splash.html"></iframe>
    </div>
  </body>
</html>
